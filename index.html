  <script>
    // Map deprecated 'unload' event to 'pagehide' to prevent Chrome Permissions Policy violation
    (function() {
      const _origAEL = window.addEventListener;
      window.addEventListener = function(type, listener, options) {
        if (type === 'unload') {
          return _origAEL.call(window, 'pagehide', listener, options);
        }
        return _origAEL.call(window, type, listener, options);
      };
    })();
  </script>

  <script>
    // ── Deep Link: Open App Banner ──────────────────────────────────────────
    // Detects Android/iOS mobile browsers and shows a banner to open/download the app.
    // The custom URL scheme "avelut://" must be registered in your Capacitor AndroidManifest.xml.
    (function () {
      try {
        var ua = navigator.userAgent || '';
        var isAndroid = /Android/i.test(ua);
        var isIOS = /iPhone|iPad|iPod/i.test(ua);
        var isStandalone = window.matchMedia('(display-mode: standalone)').matches || (window.navigator).standalone;
        var isCapacitor = typeof window.Capacitor !== 'undefined';

        // Do not show banner if already running as native app or PWA
        if (isStandalone || isCapacitor) return;

        if (isAndroid || isIOS) {
          var banner = document.createElement('div');
          banner.id = 'avelut-app-banner';
          banner.style.cssText = [
            'position:fixed', 'top:0', 'left:0', 'right:0', 'z-index:99999',
            'background:#0A0A0A', 'color:#fff', 'display:flex', 'align-items:center',
            'gap:12px', 'padding:10px 14px', 'font-family:system-ui,sans-serif',
            'font-size:13px', 'box-shadow:0 2px 12px rgba(0,0,0,0.4)',
            'border-bottom:1px solid rgba(255,255,255,0.08)'
          ].join(';');

          var playStoreUrl = 'https://play.google.com/store/apps/details?id=com.avelut.app';
          var appStoreUrl = 'https://apps.apple.com/app/avelut/idYOUR_APP_STORE_ID'; // Replace with real ID
          var storeUrl = isAndroid ? playStoreUrl : appStoreUrl;
          var deepLinkUrl = 'avelut://' + window.location.pathname.replace(/^\//, '') + window.location.search;

          banner.innerHTML = [
            '<img src="/logo_icon.png" style="width:36px;height:36px;border-radius:8px;flex-shrink:0" alt="Avelut">',
            '<div style="flex:1;min-width:0">',
              '<div style="font-weight:700;font-size:14px">AVELUT</div>',
              '<div style="color:rgba(255,255,255,0.55);font-size:11px">Better on the app &bull; Free</div>',
            '</div>',
            '<a id="avelut-banner-open" href="' + deepLinkUrl + '" style="background:#0066FF;color:#fff;border:none;border-radius:20px;padding:7px 16px;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;flex-shrink:0">Open</a>',
            '<a href="' + storeUrl + '" style="color:rgba(255,255,255,0.45);font-size:11px;text-decoration:none;flex-shrink:0;padding:4px">Get App</a>',
            '<button onclick="document.getElementById(\'avelut-app-banner\').remove();document.body.style.paddingTop=\'0\'" style="background:none;border:none;color:rgba(255,255,255,0.4);font-size:20px;cursor:pointer;line-height:1;padding:2px 4px;flex-shrink:0" aria-label="Close">&times;</button>'
          ].join('');

          document.addEventListener('DOMContentLoaded', function () {
            document.body.insertBefore(banner, document.body.firstChild);
            document.body.style.paddingTop = (banner.offsetHeight + 4) + 'px';

            // Try opening the app via custom scheme; fall back gracefully
            var openBtn = document.getElementById('avelut-banner-open');
            if (openBtn) {
              openBtn.addEventListener('click', function (e) {
                e.preventDefault();
                var fallbackTimer = setTimeout(function () {
                  window.location.href = storeUrl;
                }, 1500);
                window.location.href = deepLinkUrl;
                window.addEventListener('blur', function () { clearTimeout(fallbackTimer); }, { once: true });
              });
            }
          });
        }
      } catch (e) { /* ignore */ }
    })();
  </script>

  <style>
    html, body {
      position: fixed;
      inset: 0;
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    #root {

      width: 100%;
      overflow: hidden;
    }

    :root {
      /* Default: no extra safe-area padding (set by JS below for iOS) */
      --header-safe-top: 0.625rem;
    }

    @keyframes sk-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }
    .sk-shimmer {

    }

    }
  </style>
  <script>
    /* Set --header-safe-top correctly:
       - iOS native (standalone / webkit): needs env(safe-area-inset-top) because the
         WKWebView extends under the status bar.
       - Android (Capacitor overlaysWebView=false): The OS already offsets the WebView
         below the status bar, so env(safe-area-inset-top) would double the gap.
       - Web browser: env() is fine on iOS Safari, no-op on others. */
    (function () {
      try {
        const ua = navigator.userAgent || '';
        const isIOS = /iPhone|iPad|iPod/.test(ua);
        const isAndroid = /Android/.test(ua);
        const isCapacitor = window.Capacitor !== undefined || /; wv/.test(ua) || window.navigator.userAgent.includes('wv');
        if (isIOS) {
          // iOS: always respect safe area — WKWebView extends under notch
          document.documentElement.style.setProperty(
            '--header-safe-top',
            'max(0.625rem, env(safe-area-inset-top, 0.625rem))'
          );
        } else if (isAndroid && isCapacitor) {
          // Android Capacitor with overlaysWebView=false:
          // OS already pushes WebView below status bar — no extra padding needed
          document.documentElement.style.setProperty('--header-safe-top', '0.625rem');
        } else {
          // PWA/browser: safe to use env() — it will be 0 on Android Chrome
          document.documentElement.style.setProperty(
            '--header-safe-top',
            'max(0.625rem, env(safe-area-inset-top, 0px))'
          );
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
