  <meta charset="UTF-8" />
  <script>
    (function () {
      try {
        var m = localStorage.getItem('app_mode') || localStorage.getItem('theme');
        var isDark = false;
        if (m) {
          isDark = m === '"dark"' || m === 'dark';
        } else {
          isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = '#000000';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.backgroundColor = '#F6F6F3';
        }
      } catch (e) {}
    })();
  </script>

  <script>
    // Map deprecated 'unload' event to 'pagehide' to prevent Chrome Permissions Policy violation
    (function() {
      const _origAEL = window.addEventListener;
      window.addEventListener = function(type, listener, options) {
        if (type === 'unload') {
          return _origAEL.call(window, 'pagehide', listener, options);
        }
        return _origAEL.call(window, type, listener, options);
      };
    })();
  </script>

  <script>
    // ── Deep Link: Direct Mobile App & Native Play Store Handler ────────────
    // Automatically attempts to open the Avelut mobile app directly when visiting.
    // If not installed, redirects directly to Google Play Store native app (market://),
    // NEVER the browser Play Store webpage.
    (function () {
      try {
        var ua = navigator.userAgent || '';
        var isAndroid = /Android/i.test(ua);
        var isIOS = /iPhone|iPad|iPod/i.test(ua);
        var isStandalone = window.matchMedia('(display-mode: standalone)').matches || (window.navigator && window.navigator.standalone);
        var isCapacitor = typeof window.Capacitor !== 'undefined' || window.location.protocol === 'capacitor:';

        // Do not execute if already running inside the native app or standalone PWA
        if (isStandalone || isCapacitor) return;

        if (isAndroid || isIOS) {
          var cleanPath = (window.location.pathname.replace(/^\//, '') || '') + window.location.search;
          var androidIntentUrl = 'intent://' + (cleanPath || 'open') + '#Intent;scheme=avelut;package=com.avelut.app;end';
          var marketUrl = 'market://details?id=com.avelut.app';
          var appStoreUrl = 'https://apps.apple.com/app/avelut/idYOUR_APP_STORE_ID';
          var storeUrl = isAndroid ? marketUrl : appStoreUrl;

          function launchMobileApp(isUserAction) {
            var hasLeftPage = false;
            var startTime = Date.now();

            function onPageInactive() {
              hasLeftPage = true;
            }
            window.addEventListener('pagehide', onPageInactive, { once: true });
            window.addEventListener('blur', onPageInactive, { once: true });
            document.addEventListener('visibilitychange', function () {
              if (document.hidden) hasLeftPage = true;
            }, { once: true });

            if (isAndroid) {
              // 1. Android Chrome Intent:
              // - If com.avelut.app is installed: opens Avelut app directly.
              // - If com.avelut.app is NOT installed: Chrome forwards to Google Play Store app natively.
              window.location.href = androidIntentUrl;

              // 2. Fallback for browsers where intent doesn't resolve or auto-route:
              // If the page remains active after 1200ms, open Google Play Store native app directly.
              setTimeout(function () {
                if (!hasLeftPage && (Date.now() - startTime < 3500)) {
                  window.location.href = marketUrl;
                }
              }, 1200);
            } else if (isIOS) {
              var iosSchemeUrl = 'avelut://' + (cleanPath || 'open');
              window.location.href = iosSchemeUrl;
              setTimeout(function () {
                if (!hasLeftPage && (Date.now() - startTime < 3500)) {
                  window.location.href = appStoreUrl;
                }
              }, 1500);
            }
          }

          // ── Auto-Open on Website Visit ────────────────────────────────────
          // When visiting the website on Android, attempt to open the app directly.
          // Uses sessionStorage to avoid redirect loops if the user returns back to the browser.
          if (isAndroid) {
            try {
              var alreadyVisited = sessionStorage.getItem('avelut_deep_link_auto_triggered');
              if (!alreadyVisited) {
                sessionStorage.setItem('avelut_deep_link_auto_triggered', '1');
                setTimeout(function () {
                  launchMobileApp(false);
                }, 350);
              }
            } catch (e) { /* ignore storage errors */ }
          }

          // ── Smart Top Banner ──────────────────────────────────────────────
          var banner = document.createElement('div');
          banner.id = 'avelut-app-banner';
          banner.style.cssText = [
            'position:fixed', 'top:0', 'left:0', 'right:0', 'z-index:999999',
            'background:#0D0F14', 'color:#fff', 'display:flex', 'align-items:center',
            'gap:12px', 'padding:10px 14px', 'font-family:system-ui,-apple-system,sans-serif',
            'font-size:13px', 'box-shadow:0 4px 20px rgba(0,0,0,0.5)',
            'border-bottom:1px solid rgba(255,255,255,0.1)'
          ].join(';');

          banner.innerHTML = [
            '<img src="/logo_icon.png" style="width:36px;height:36px;border-radius:9px;flex-shrink:0;object-fit:cover" alt="Avelut">',
            '<div style="flex:1;min-width:0">',
              '<div style="font-weight:700;font-size:14px;letter-spacing:-0.01em">AVELUT</div>',
              '<div style="color:rgba(255,255,255,0.65);font-size:11px">Open in mobile app &bull; Free</div>',
            '</div>',
            '<button id="avelut-banner-open" style="background:#0066FF;color:#fff;border:none;border-radius:20px;padding:7px 16px;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;flex-shrink:0;outline:none">Open</button>',
            '<a id="avelut-banner-store" href="' + storeUrl + '" style="color:rgba(255,255,255,0.7);font-size:11px;font-weight:500;text-decoration:none;flex-shrink:0;padding:6px 4px">Get App</a>',
            '<button id="avelut-banner-close" style="background:none;border:none;color:rgba(255,255,255,0.45);font-size:20px;cursor:pointer;line-height:1;padding:2px 6px;flex-shrink:0" aria-label="Close">&times;</button>'
          ].join('');

          function attachBanner() {
            if (!document.body || document.getElementById('avelut-app-banner')) return;
            document.body.insertBefore(banner, document.body.firstChild);
            document.body.style.paddingTop = (banner.offsetHeight || 56) + 'px';

            var openBtn = document.getElementById('avelut-banner-open');
            if (openBtn) {
              openBtn.addEventListener('click', function (e) {
                e.preventDefault();
                launchMobileApp(true);
              });
            }

            var storeBtn = document.getElementById('avelut-banner-store');
            if (storeBtn && isAndroid) {
              storeBtn.addEventListener('click', function (e) {
                e.preventDefault();
                window.location.href = marketUrl;
              });
            }

            var closeBtn = document.getElementById('avelut-banner-close');
            if (closeBtn) {
              closeBtn.addEventListener('click', function () {
                banner.remove();
                document.body.style.paddingTop = '0';
              });
            }
          }

          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', attachBanner);
          } else {
            attachBanner();
          }
        }
      } catch (e) { /* ignore */ }
    })();
  </script>

  <style>
    html, body {
      position: fixed;
      inset: 0;
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    #root {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    :root {
      /* Extreme top safe-area padding directly from device system status bar */
      --header-safe-top: env(safe-area-inset-top, 0px);
    }

    @keyframes sk-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }
    .sk-shimmer {
      animation: sk-pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    #app-launch-skeleton {
      background-color: #F6F6F3;
    }
    html.dark #app-launch-skeleton,
    @media (prefers-color-scheme: dark) {
      #app-launch-skeleton {
        background-color: #000000 !important;
      }
      #app-launch-skeleton > div:first-child {
        background: rgba(20, 20, 20, 0.95) !important;
        border-bottom-color: rgba(255, 255, 255, 0.08) !important;
      }
      #app-launch-skeleton div[data-sk-card="true"] {
        background: #141414 !important;
        border-color: rgba(255, 255, 255, 0.08) !important;
      }
      #app-launch-skeleton div[data-sk-bar="true"] {
        background: #141414 !important;
        border-color: rgba(255, 255, 255, 0.08) !important;
      }
      #app-launch-skeleton div[data-sk-bg="subtle"] {
        background: rgba(255, 255, 255, 0.08) !important;
      }
    }
  </style>
  <script>
    /* Set --header-safe-top correctly:
       - iOS native / Web: respect env(safe-area-inset-top) directly for extreme top positioning.
       - Android native (Capacitor): MainActivity already pushes WebView below the status bar,
         so 0px allows header items to sit flush at the extreme top below the status bar. */
    (function () {
      try {
        const ua = navigator.userAgent || '';
        const isIOS = /iPhone|iPad|iPod/.test(ua);
        const isAndroid = /Android/.test(ua);
        const isCapacitor = window.Capacitor !== undefined || /; wv/.test(ua) || window.navigator.userAgent.includes('wv');
        if (isIOS) {
          document.documentElement.style.setProperty(
            '--header-safe-top',
            'env(safe-area-inset-top, 0px)'
          );
        } else if (isAndroid && isCapacitor) {
          document.documentElement.style.setProperty('--header-safe-top', '0px');
        } else {
          document.documentElement.style.setProperty(
            '--header-safe-top',
            'env(safe-area-inset-top, 0px)'
          );
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>

<body class="bg-[#F6F6F3] dark:bg-black text-[#0F172A] dark:text-[#F8FAFC] transition-colors duration-300 antialiased overflow-hidden">

        <div data-sk-bg="subtle" style="width:40%;height:20px;border-radius:6px;background:rgba(0,0,0,0.08);margin-bottom:4px;"></div>

        <div data-sk-card="true" style="width:85%;height:80px;border-radius:20px;background:#ffffff;border:1px solid rgba(0,0,0,0.05);box-shadow:0 2px 8px rgba(0,0,0,0.02);"></div>

      <!-- Bottom Composer Bar -->

        <div data-sk-bg="subtle" style="height:48px;border-radius:24px;background:rgba(0,0,0,0.04);border:1px solid rgba(0,0,0,0.06);"></div>

    </div>
